version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/community.lazycat.app.redink.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git

build:
  toolchains: []
  run_buildscript: false

images:
  - id: redink
    target: service
    service: redink
    source: docker.io/histonemax/redink
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: 红墨
    summary: Published from GitHub Actions
